<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>AI Chat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M9 12h14M9 16h10M9 20h7' stroke='white' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #ffffff;
  --bg-soft: #f7f7f8;
  --panel: #ffffff;
  --border: #e6e7eb;
  --border-strong: #d3d5dc;
  --text: #14161c;
  --text-2: #4a4f5c;
  --muted: #8b90a0;
  --accent: #2563eb;
  --accent-soft: #eef3ff;
  --user-bubble: #f1f2f6;
  --danger: #dc2626;
  --shadow: 0 1px 2px rgba(16, 18, 24, .06), 0 8px 24px rgba(16, 18, 24, .06);
  --code-bg: #12141a;
  --code-text: #e8eaf0;
  --radius: 14px;
  --warn-bg: #fff8e6;
  --warn-border: #efd08a;
  --warn-text: #7a5300;
  --warn-strong: #5c3e00;
}

html[data-theme="dark"] {
  --bg: #0c0e13;
  --bg-soft: #13161d;
  --panel: #13161d;
  --border: #262a35;
  --border-strong: #333846;
  --text: #e9ebf1;
  --text-2: #b6bbc8;
  --muted: #868c9b;
  --accent: #4d8dff;
  --accent-soft: #17203a;
  --user-bubble: #1c2029;
  --danger: #f87171;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
  --code-bg: #0a0c11;
  --code-text: #e8eaf0;
  --warn-bg: #2b2312;
  --warn-border: #6b5423;
  --warn-text: #f0d089;
  --warn-strong: #ffe6ad;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
}

body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB",
        "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

button, input, select, textarea { font: inherit; color: inherit; }

.hidden { display: none !important; }

/* ---------------- 布局 ---------------- */
.app {
  display: flex;
  height: 100dvh;
  overflow: hidden;
}

.sidebar {
  width: 268px;
  flex: 0 0 268px;
  background: var(--bg-soft);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.side-head { padding: 14px 12px 8px; }

.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 4px 8px 14px;
  font-weight: 650;
  font-size: 15px;
  letter-spacing: .2px;
}

.brand-dot {
  width: 22px; height: 22px; border-radius: 7px;
  background: var(--accent);
  display: grid; place-items: center;
  color: #fff; font-size: 12px; font-weight: 700;
}

.conv-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 8px 8px;
  min-height: 0;
}

.conv-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 10px;
  border-radius: 10px;
  cursor: pointer;
  color: var(--text-2);
  transition: background .12s ease, color .12s ease;
}

.conv-item:hover { background: rgba(127, 140, 170, .12); color: var(--text); }
.conv-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 550; }

.conv-title {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 14px;
}

.conv-del {
  border: 0; background: transparent; cursor: pointer;
  color: var(--muted); font-size: 17px; line-height: 1;
  padding: 2px 5px; border-radius: 6px; opacity: 0;
  transition: opacity .12s ease, background .12s ease;
}
.conv-item:hover .conv-del { opacity: 1; }
.conv-del:hover { background: rgba(220, 38, 38, .14); color: var(--danger); }

.empty-side { padding: 18px 12px; color: var(--muted); font-size: 13px; text-align: center; }

.side-foot {
  border-top: 1px solid var(--border);
  padding: 10px 12px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.side-foot .row { display: flex; gap: 8px; }
.side-foot .row > * { flex: 1; }

/* ---------------- 通用控件 ---------------- */
.btn {
  border: 1px solid var(--border-strong);
  background: var(--panel);
  color: var(--text);
  border-radius: 10px;
  padding: 8px 12px;
  cursor: pointer;
  font-size: 13.5px;
  transition: background .12s ease, border-color .12s ease, opacity .12s ease;
  white-space: nowrap;
}
.btn:hover { background: var(--bg-soft); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 550; }
.btn.primary:hover { filter: brightness(1.06); background: var(--accent); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn.ghost:hover { background: rgba(127, 140, 170, .14); color: var(--text); }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.tiny { padding: 3px 8px; font-size: 12px; border-radius: 8px; border-color: transparent; background: transparent; color: var(--muted); }
.btn.tiny:hover { background: rgba(127, 140, 170, .16); color: var(--text); }
.btn.icon { border-color: transparent; background: transparent; padding: 6px 9px; font-size: 15px; color: var(--text-2); }
.btn.icon:hover { background: rgba(127, 140, 170, .14); color: var(--text); }
.btn.round { width: 38px; height: 38px; padding: 0; border-radius: 50%; display: grid; place-items: center; font-size: 16px; }

select {
  width: 100%;
  padding: 8px 10px;
  border-radius: 10px;
  border: 1px solid var(--border-strong);
  background: var(--panel);
  font-size: 13.5px;
  cursor: pointer;
}

input[type="text"], input[type="password"], textarea {
  width: 100%;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid var(--border-strong);
  background: var(--panel);
  outline: none;
  transition: border-color .12s ease, box-shadow .12s ease;
}
input:focus, textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

/* ---------------- 主区域 ---------------- */
.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--bg);
}

.topbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  min-height: 54px;
}

.topbar .title {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 550;
  font-size: 14.5px;
}

.topbar .model-tag {
  font-size: 12px;
  color: var(--muted);
  border: 1px solid var(--border);
  padding: 3px 9px;
  border-radius: 999px;
  white-space: nowrap;
}

#menuBtn { display: none; }

/* 配置缺失横幅：变量被清空时直接把原因摆在页面上，不让人对着 500 猜 */
.warn-banner {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  margin: 12px auto 0;
  max-width: 820px;
  width: calc(100% - 40px);
  padding: 11px 13px;
  background: var(--warn-bg);
  border: 1px solid var(--warn-border);
  border-radius: 10px;
  color: var(--warn-text);
  font-size: 13px;
  line-height: 1.55;
}

.warn-banner.hidden { display: none; }

.warn-banner .warn-mark {
  flex: 0 0 auto;
  width: 18px;
  height: 18px;
  margin-top: 1px;
  border-radius: 50%;
  background: var(--warn-text);
  color: var(--warn-bg);
  font-size: 12px;
  font-weight: 700;
  line-height: 18px;
  text-align: center;
}

.warn-banner .warn-body { flex: 1; min-width: 0; }
.warn-banner strong { display: block; color: var(--warn-strong); margin-bottom: 2px; }
.warn-banner code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 12px;
  padding: 1px 5px;
  border-radius: 5px;
  background: rgba(127, 140, 170, .22);
}
.warn-banner .warn-close {
  flex: 0 0 auto;
  border: 0;
  background: transparent;
  color: var(--warn-text);
  font-size: 17px;
  line-height: 1;
  padding: 0 2px;
  cursor: pointer;
  opacity: .7;
}
.warn-banner .warn-close:hover { opacity: 1; }

.messages {
  flex: 1;
  overflow-y: auto;
  min-height: 0;
  scroll-behavior: smooth;
}

.msg-wrap { max-width: 820px; margin: 0 auto; padding: 0 20px; }

.msg {
  display: flex;
  gap: 13px;
  padding: 18px 0;
}

.avatar {
  flex: 0 0 30px;
  width: 30px; height: 30px;
  border-radius: 9px;
  display: grid; place-items: center;
  font-size: 12px; font-weight: 650;
  background: var(--accent);
  color: #fff;
  user-select: none;
}

.msg.user .avatar { background: var(--user-bubble); color: var(--text-2); }

.bubble { flex: 1; min-width: 0; }

.msg.user .bubble {
  background: var(--user-bubble);
  border-radius: 14px;
  padding: 11px 15px;
}

.msg.assistant .bubble { padding-top: 3px; }

.md { overflow-wrap: anywhere; word-break: break-word; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p { margin: 0 0 12px; }
.md h3, .md h4, .md h5, .md h6 { margin: 20px 0 10px; line-height: 1.35; }
.md h3 { font-size: 18px; }
.md h4 { font-size: 16.5px; }
.md h5, .md h6 { font-size: 15px; }
.md ul, .md ol { margin: 0 0 12px; padding-left: 22px; }
.md li { margin: 4px 0; }
.md a { color: var(--accent); text-decoration: none; border-bottom: 1px solid transparent; }
.md a:hover { border-bottom-color: currentColor; }
.md hr { border: 0; border-top: 1px solid var(--border); margin: 18px 0; }
.md blockquote {
  margin: 0 0 12px;
  padding: 4px 0 4px 14px;
  border-left: 3px solid var(--border-strong);
  color: var(--text-2);
}
.md blockquote p { margin: 4px 0; }
.md code.ic {
  background: rgba(127, 140, 170, .16);
  padding: 1.5px 5px;
  border-radius: 5px;
  font-size: .9em;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
.md del { color: var(--muted); }
.md table { border-collapse: collapse; margin: 0 0 12px; width: 100%; font-size: 14px; }
.md th, .md td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }

/* ---------------- 思考过程（模型输出的  thinking 块） ---------------- */
.think-box {
  margin: 0 0 12px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--bg-soft);
  overflow: hidden;
}
.think-box > summary {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 9px 13px;
  font-size: 12.5px;
  color: var(--muted);
  cursor: pointer;
  user-select: none;
  list-style: none;
}
.think-box > summary::-webkit-details-marker { display: none; }
.think-box > summary:hover { color: var(--text-2); }
.think-box[open] > summary { border-bottom: 1px solid var(--border); color: var(--text-2); }
.think-chev { flex: none; display: flex; transition: transform .16s ease; }
.think-chev svg { width: 13px; height: 13px; display: block; }
.think-box[open] .think-chev { transform: rotate(90deg); }
.think-label { font-weight: 600; letter-spacing: .2px; }
.think-meta { color: var(--muted); font-variant-numeric: tabular-nums; }
.think-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent); flex: none;
  animation: thinkPulse 1.1s ease-in-out infinite;
}
@keyframes thinkPulse {
  0%, 100% { opacity: .3; transform: scale(.85); }
  50% { opacity: 1; transform: scale(1); }
}
.think-body {
  padding: 11px 14px 13px;
  font-size: 13.5px;
  line-height: 1.75;
  color: var(--text-2);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  max-height: 320px;
  overflow-y: auto;
}

/* 有思考块时正文被包一层，这两条等价于 .md 的 first/last-child 规则 */
.md-body > :first-child { margin-top: 0; }
.md-body > :last-child { margin-bottom: 0; }

.code-block {
  margin: 0 0 14px;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--border);
  background: var(--code-bg);
}
.code-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 10px 6px 13px;
  font-size: 11.5px;
  letter-spacing: .4px;
  text-transform: uppercase;
  color: #8f97a8;
  background: rgba(255, 255, 255, .045);
}
/* 代码块头部的复制按钮样式见下方 .code-head .icon-btn（原来那套文字按钮样式已废弃） */
.code-block pre { margin: 0; padding: 13px 15px; overflow-x: auto; }
.code-block code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 13px;
  line-height: 1.62;
  color: var(--code-text);
  white-space: pre;
}

.msg-actions {
  display: flex;
  gap: 2px;
  margin-top: 8px;
  opacity: 0;
  transition: opacity .14s ease;
}
.msg:hover .msg-actions { opacity: 1; }

/* 纯图标按钮（复制 / 重新生成） */
.icon-btn {
  width: 27px;
  height: 27px;
  padding: 0;
  display: grid;
  place-items: center;
  border: 1px solid transparent;
  border-radius: 8px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: background .12s ease, color .12s ease, transform .1s ease;
}
.icon-btn:hover { background: rgba(127, 140, 170, .18); color: var(--text); }
.icon-btn:active { transform: scale(.92); }
.icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.icon-btn.done { color: var(--accent); }
.icon-btn.done:hover { background: var(--accent-soft); }
.icon-btn svg { width: 16px; height: 16px; display: block; pointer-events: none; }
/* 代码块里的图标按钮在深色底上，配色单独处理 */
.code-head .icon-btn { width: 24px; height: 24px; padding: 0; border-radius: 6px; color: #a7aebd; }
.code-head .icon-btn:hover { background: rgba(255, 255, 255, .12); color: #fff; }
.code-head .icon-btn.done { color: #6ee7a8; }
.code-head .icon-btn svg { width: 14px; height: 14px; }

.cursor-blink {
  display: inline-block;
  width: 7px; height: 15px;
  background: var(--accent);
  border-radius: 1.5px;
  vertical-align: -2px;
  animation: blink 1s steps(2, start) infinite;
}
@keyframes blink { 0%, 50% { opacity: 1 } 50.01%, 100% { opacity: 0 } }

/* 空状态 */
.welcome {
  max-width: 820px;
  margin: 0 auto;
  padding: 8vh 20px 40px;
  text-align: center;
}
.welcome h1 { font-size: 26px; margin: 0 0 8px; letter-spacing: -.3px; }
.welcome p { color: var(--muted); margin: 0 0 28px; font-size: 14.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.chip {
  border: 1px solid var(--border-strong);
  background: var(--panel);
  border-radius: 12px;
  padding: 11px 15px;
  cursor: pointer;
  font-size: 13.5px;
  color: var(--text-2);
  text-align: left;
  max-width: 300px;
  transition: border-color .12s ease, background .12s ease, transform .12s ease;
}
.chip:hover { border-color: var(--accent); background: var(--accent-soft); color: var(--text); transform: translateY(-1px); }

/* 输入区 */
.composer { padding: 8px 20px 16px; }
.composer-inner {
  max-width: 820px;
  margin: 0 auto;
  display: flex;
  align-items: flex-end;
  gap: 9px;
  border: 1px solid var(--border-strong);
  background: var(--panel);
  border-radius: 20px;
  padding: 9px 9px 9px 16px;
  box-shadow: var(--shadow);
  transition: border-color .14s ease, box-shadow .14s ease;
}
.composer-inner:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow); }
.composer textarea {
  flex: 1;
  border: 0;
  box-shadow: none !important;
  padding: 6px 0;
  resize: none;
  max-height: 190px;
  background: transparent;
  line-height: 1.55;
}
.composer textarea:focus { border: 0; }
.hint {
  max-width: 820px;
  margin: 7px auto 0;
  font-size: 11.5px;
  color: var(--muted);
  text-align: center;
  min-height: 16px;
}

/* 遮罩 / 弹层 */
.scrim {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(10, 12, 18, .45);
  z-index: 40;
}
.scrim.show { display: block; }

.overlay {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: var(--bg);
  display: grid;
  place-items: center;
  padding: 24px;
}

.login-card {
  width: 100%;
  max-width: 348px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 28px 24px 24px;
  box-shadow: var(--shadow);
}
.login-card h2 { margin: 0 0 6px; font-size: 19px; }
.login-card p { margin: 0 0 18px; color: var(--muted); font-size: 13.5px; }
.login-card .err { color: var(--danger); font-size: 13px; min-height: 19px; margin-top: 9px; }

.modal-mask {
  position: fixed; inset: 0; z-index: 70;
  background: rgba(10, 12, 18, .45);
  display: grid; place-items: center; padding: 24px;
}
.modal {
  width: 100%; max-width: 360px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  box-shadow: var(--shadow);
}
.modal h3 { margin: 0 0 14px; font-size: 16px; }
.modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

.toast {
  position: fixed;
  left: 50%;
  bottom: 30px;
  transform: translate(-50%, 14px);
  background: #16181f;
  color: #f2f4f8;
  padding: 9px 16px;
  border-radius: 10px;
  font-size: 13.5px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s ease, transform .2s ease;
  z-index: 90;
  max-width: 88vw;
  text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* 错误提示条 */
.notice {
  max-width: 820px;
  margin: 0 auto 12px;
  padding: 10px 14px;
  border-radius: 12px;
  background: rgba(220, 38, 38, .09);
  border: 1px solid rgba(220, 38, 38, .28);
  color: var(--danger);
  font-size: 13.5px;
  display: flex;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
}

/* 滚动条 */
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: rgba(127, 140, 170, .34); border-radius: 8px; }
::-webkit-scrollbar-thumb:hover { background: rgba(127, 140, 170, .55); }
::-webkit-scrollbar-track { background: transparent; }

/* ---------------- 移动端 ---------------- */
@media (max-width: 820px) {
  .sidebar {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    z-index: 50;
    transform: translateX(-100%);
    transition: transform .22s ease;
    box-shadow: var(--shadow);
  }
  .sidebar.open { transform: translateX(0); }
  #menuBtn { display: block; }
  .msg-wrap, .welcome, .composer-inner, .hint, .notice { padding-left: 14px; padding-right: 14px; }
  .composer { padding-left: 0; padding-right: 0; }
  .welcome { padding-top: 6vh; }
  .msg-actions { opacity: 1; }
  /* 图标按钮在触屏上要够大，否则点不准 */
  .icon-btn { width: 34px; height: 34px; }
  .icon-btn svg { width: 18px; height: 18px; }
  .msg-actions { gap: 4px; }
}
</style>
</head>
<body>

<!-- 登录层（仅在配置了 ACCESS_PASSWORD 时出现） -->
<div id="loginOverlay" class="overlay hidden">
  <form class="login-card" id="loginForm" autocomplete="on">
    <h2 id="loginTitle">AI Chat</h2>
    <p>请输入访问密码</p>
    <input type="password" id="loginPassword" name="password" placeholder="访问密码"
           autocomplete="current-password" required>
    <div class="err" id="loginError"></div>
    <button type="submit" class="btn primary" id="loginSubmit" style="width:100%;margin-top:4px;">进入</button>
  </form>
</div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <div class="brand">
        <span class="brand-dot" aria-hidden="true">AI</span>
        <span id="brandName">AI Chat</span>
      </div>
      <button class="btn primary" id="newChatBtn" style="width:100%">＋ 新对话</button>
    </div>
    <div class="conv-list" id="convList"></div>
    <div class="side-foot">
      <select id="modelSelect" title="选择模型"></select>
      <div class="row">
        <button class="btn" id="themeBtn" type="button">深色</button>
        <button class="btn hidden" id="logoutBtn" type="button">退出</button>
      </div>
    </div>
  </aside>

  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="topbar">
      <button class="btn icon" id="menuBtn" type="button" aria-label="菜单">☰</button>
      <div class="title" id="convTitle">新对话</div>
      <span class="model-tag" id="modelTag"></span>
      <button class="btn icon" id="renameBtn" type="button" title="重命名当前对话">✎</button>
    </header>

    <div class="warn-banner hidden" id="warnBanner" role="alert">
      <span class="warn-mark" aria-hidden="true">!</span>
      <div class="warn-body">
        <strong id="warnTitle"></strong>
        <span id="warnText"></span>
      </div>
      <button class="warn-close" id="warnClose" type="button" aria-label="关闭提示">×</button>
    </div>

    <div class="messages" id="messages"></div>

    <div class="composer">
      <div class="composer-inner">
        <textarea id="input" rows="1" placeholder="发送消息…（Enter 发送，Shift + Enter 换行）"></textarea>
        <button class="btn primary round" id="sendBtn" type="button" title="发送">↑</button>
        <button class="btn danger round hidden" id="stopBtn" type="button" title="停止生成">■</button>
      </div>
      <div class="hint" id="hint"></div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  var $ = function (sel, root) { return (root || document).querySelector(sel); };

  var state = {
    conversations: [],
    current: null,      // { id, title, messages: [] }
    models: [],
    model: '',
    streaming: false,
    controller: null,
    abortReason: null,
    needsAuth: false,
    title: 'AI Chat',
    endpointHost: '',
    missing: [],        // 后端报回来的缺失必填变量，例如 ['API_URL']
    missingHint: ''
  };

  var LS_THEME = 'ai_chat_theme';
  var LS_MODEL = 'ai_chat_model';
  var toastTimer = null;

  /* 图标一律内联 SVG，不引任何图标库（和「零外部依赖」保持一致） */
  var SVG_OPEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
  var ICONS = {
    copy: SVG_OPEN +
      '<rect x="9" y="9" width="13" height="13" rx="2"/>' +
      '<path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
    check: SVG_OPEN.replace('stroke-width="2"', 'stroke-width="2.6"') +
      '<polyline points="20 6 9 17 4 12"/></svg>',
    refresh: SVG_OPEN +
      '<polyline points="22 5 22 10 17 10"/>' +
      '<path d="M19.7 14.6A8 8 0 1 1 17.7 6.3L22 10"/></svg>',
    chevron: SVG_OPEN + '<polyline points="9 6 15 12 9 18"/></svg>'
  };

  /** 生成一个图标按钮；label 同时用作 title 和 aria-label，保证只有图标也能看懂 */
  function iconButton(icon, label, action) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'icon-btn';
    btn.title = label;
    btn.setAttribute('aria-label', label);
    btn.dataset.action = action;
    btn.innerHTML = ICONS[icon];
    return btn;
  }

  /** 点击后短暂换成「已完成」图标，让纯图标按钮有明确反馈 */
  function flashIcon(btn, doneIcon, backIcon) {
    btn.innerHTML = ICONS[doneIcon];
    btn.classList.add('done');
    clearTimeout(btn.__flashTimer);
    btn.__flashTimer = setTimeout(function () {
      btn.innerHTML = ICONS[backIcon];
      btn.classList.remove('done');
    }, 1300);
  }

  /* ---------------- 工具 ---------------- */

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function showToast(msg) {
    var el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2600);
  }

  function ApiError(message, status) {
    this.name = 'ApiError';
    this.message = message;
    this.status = status;
  }
  ApiError.prototype = Object.create(Error.prototype);

  async function api(path, opts) {
    opts = opts || {};
    var res;
    try {
      res = await fetch(path, {
        method: opts.method || 'GET',
        headers: Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {}),
        body: opts.body,
        signal: opts.signal
      });
    } catch (e) {
      throw new ApiError('网络请求失败，请检查连接后重试', 0);
    }

    var text = await res.text();
    var data = null;
    if (text) {
      try { data = JSON.parse(text); }
      catch (e) { throw new ApiError('服务端返回了非 JSON 内容（HTTP ' + res.status + '）', res.status); }
    }

    if (res.status === 401) {
      state.needsAuth = true;
      showLogin();
      throw new ApiError((data && data.message) || '未登录或登录已过期', 401);
    }
    if (res.status === 403) throw new ApiError('没有权限执行该操作', 403);
    if (!res.ok) throw new ApiError((data && data.message) || ('服务端错误（HTTP ' + res.status + '）'), res.status);
    return data;
  }

  /** 复制成功返回 true，失败返回 false（调用方据此决定要不要换成对勾图标） */
  async function copyText(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
      } else {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      showToast('已复制');
      return true;
    } catch (e) {
      showToast('复制失败');
      return false;
    }
  }

  /* ---------------- Markdown 渲染 ---------------- */

  function renderMarkdown(src) {
    var codeBlocks = [];
    var text = String(src == null ? '' : src).replace(/\r\n/g, '\n');

    // 先摘出围栏代码块（未闭合的也按代码块处理）
    text = text.replace(/```([^\n`]*)\n?([\s\S]*?)(?:```|$)/g, function (m, lang, code) {
      codeBlocks.push({ lang: String(lang).trim(), code: code.replace(/\n$/, '') });
      return '\u0000C' + (codeBlocks.length - 1) + '\u0000';
    });

    text = escapeHtml(text);

    // 行内代码
    text = text.replace(/`([^`\n]+)`/g, '<code class="ic">$1</code>');
    // 粗体 / 斜体 / 删除线
    text = text.replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>');
    text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/(^|[^*\w])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    text = text.replace(/~~([^~]+)~~/g, '<del>$1</del>');
    // 链接（仅允许 http/https）
    text = text.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    // 裸链接
    text = text.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,
      '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');

    var lines = text.split('\n');
    var out = [];
    var listType = null;
    var inQuote = false;

    function closeList() { if (listType) { out.push('</' + listType + '>'); listType = null; } }
    function closeQuote() { if (inQuote) { out.push('</blockquote>'); inQuote = false; } }

    for (var i = 0; i < lines.length; i += 1) {
      var raw = lines[i];
      var trimmed = raw.trim();

      // 代码块占位符
      if (/^\u0000C\d+\u0000$/.test(trimmed)) {
        closeList(); closeQuote();
        var block = codeBlocks[Number(trimmed.slice(2, -1))];
        var langLabel = block.lang ? escapeHtml(block.lang) : 'code';
        out.push(
          '<div class="code-block">' +
            '<div class="code-head"><span>' + langLabel + '</span>' +
            '<button type="button" class="copy-code icon-btn" title="复制代码" ' +
            'aria-label="复制代码" data-action="copy-code">' + ICONS.copy + '</button></div>' +
            '<pre><code>' + escapeHtml(block.code) + '</code></pre>' +
          '</div>'
        );
        continue;
      }

      if (!trimmed) { closeList(); closeQuote(); continue; }

      var m;

      if ((m = trimmed.match(/^(#{1,6})\s+(.*)$/))) {
        closeList(); closeQuote();
        var level = Math.min(m[1].length + 2, 6);
        out.push('<h' + level + '>' + m[2] + '</h' + level + '>');
        continue;
      }

      if (/^(?:-{3,}|\*{3,}|_{3,})$/.test(trimmed)) { closeList(); closeQuote(); out.push('<hr>'); continue; }

      if ((m = trimmed.match(/^&gt;\s?(.*)$/))) {
        closeList();
        if (!inQuote) { out.push('<blockquote>'); inQuote = true; }
        out.push('<p>' + m[1] + '</p>');
        continue;
      }

      if ((m = trimmed.match(/^[-*+]\s+(.*)$/))) {
        closeQuote();
        if (listType !== 'ul') { closeList(); out.push('<ul>'); listType = 'ul'; }
        out.push('<li>' + m[1] + '</li>');
        continue;
      }

      if ((m = trimmed.match(/^\d+[.)]\s+(.*)$/))) {
        closeQuote();
        if (listType !== 'ol') { closeList(); out.push('<ol>'); listType = 'ol'; }
        out.push('<li>' + m[1] + '</li>');
        continue;
      }

      closeList(); closeQuote();
      out.push('<p>' + raw + '</p>');
    }

    closeList(); closeQuote();
    return out.join('');
  }

  /* ---------------- 思考过程（模型输出的 think 标签） ---------------- */

  /**
   * 把模型输出里的 think 标签拆成「思考过程」和「正文」两段。
   *
   * 为什么要做：不少模型（Qwen / GLM / 各类蒸馏版）会把推理过程直接写进正文，
   * 用 think 标签包起来。以前前端把整段当 Markdown 渲染，标签被 HTML 转义成纯文本，
   * 于是聊天框里出现一对裸的 <think>…</think>，既难看又占地方。
   *
   * 返回 { blocks: string[], answer: string, open: boolean }
   * open = true 表示最后一段还没闭合（流式输出中），此时它后面的内容都算思考。
   */
  var THINK_OPEN_RE = /<\s*(think|thinking|reasoning)\s*>/i;

  function splitThinking(raw) {
    var rest = String(raw == null ? '' : raw);
    var blocks = [];
    var answer = '';
    var open = false;

    while (rest) {
      var m = rest.match(THINK_OPEN_RE);
      if (!m) break;
      answer += rest.slice(0, m.index);

      var after = rest.slice(m.index + m[0].length);
      var closeRe = new RegExp('<\\s*/\\s*' + m[1] + '\\s*>', 'i');
      var c = after.match(closeRe);

      if (!c) {
        // 还没闭合：剩下的全算思考，正文到此为止
        blocks.push(after);
        rest = '';
        open = true;
        break;
      }
      blocks.push(after.slice(0, c.index));
      rest = after.slice(c.index + c[0].length);
    }

    if (!open) answer += rest;
    return { blocks: blocks, answer: answer, open: open };
  }

  /** 只要正文，给「复制」按钮用 —— 别把思考过程也复制进去 */
  function answerOnly(raw) {
    var parts = splitThinking(raw);
    return parts.answer.trim() ? parts.answer : String(raw == null ? '' : raw);
  }

  /**
   * 一个可折叠的思考框。用原生 <details>，展开/收起不写一行 JS，
   * 键盘（Tab + Enter）和读屏软件也天然可用。
   *
   * thinking = true 表示标签还没闭合、模型正在思考（显示脉冲点和「思考中…」）；
   * false 表示思考已结束（显示箭头和字数）。两者都可能处于展开状态 ——
   * 流式输出期间整条消息都保持展开，等回答结束才收起。
   */
  function thinkBoxNode(text, thinking) {
    var box = document.createElement('details');
    box.className = 'think-box';

    var summary = document.createElement('summary');

    if (thinking) {
      var dot = document.createElement('span');
      dot.className = 'think-dot';
      summary.appendChild(dot);
    } else {
      var chev = document.createElement('span');
      chev.className = 'think-chev';
      chev.innerHTML = ICONS.chevron;
      summary.appendChild(chev);
    }

    var label = document.createElement('span');
    label.className = 'think-label';
    label.textContent = thinking ? '思考中…' : '思考过程';
    summary.appendChild(label);

    var meta = document.createElement('span');
    meta.className = 'think-meta';
    var chars = String(text || '').replace(/\s+/g, '').length;
    meta.textContent = thinking ? '' : '· ' + chars + ' 字';
    summary.appendChild(meta);

    var body = document.createElement('div');
    body.className = 'think-body';
    body.textContent = String(text || '').trim();

    box.appendChild(summary);
    box.appendChild(body);
    return box;
  }

  /**
   * 渲染消息正文：思考框在上，回答在下。
   *
   * 展开状态记在容器上（el.__thinkOpen）：流式时每帧都会重建 DOM，
   * 不记的话用户刚点开的框会被下一帧合上。
   */
  function renderContent(el, content, streaming) {
    var parts = splitThinking(content);
    el.innerHTML = '';

    if (!parts.blocks.length) {
      // 没有思考块就走原来的路径，DOM 结构和以前完全一致
      el.innerHTML = renderMarkdown(parts.answer);
      return;
    }

    var keepOpen = el.__thinkOpen;
    parts.blocks.forEach(function (text, i) {
      var isLast = i === parts.blocks.length - 1;
      // 两个状态要分开：
      //   thinking     —— 标签还没闭合，模型正在思考（显示「思考中…」+ 脉冲点）
      //   openByDefault —— 整条消息还在流式输出，思考块默认展开
      // 以前把两者混成一个 live，导致 </think> 一出现框就合上；
      // 那时回答还在打字，页面会突然往上跳一下。现在等整条回答结束才收起。
      var thinking = !!streaming && isLast && parts.open;
      var openByDefault = !!streaming && isLast;
      var box = thinkBoxNode(text, thinking);
      // 没手动开合过：流式期间展开，结束后收起
      box.open = typeof keepOpen === 'boolean' ? keepOpen : openByDefault;
      // 用 click 而不是 toggle 记状态：toggle 对「程序化设置 open」也会触发，
      // 流式时每帧都在设 open，用它会把默认展开误记成「用户手动展开」，
      // 结果流式结束后框再也收不起来。
      $('summary', box).addEventListener('click', function () { el.__thinkOpen = !box.open; });
      el.appendChild(box);
    });

    var body = document.createElement('div');
    body.className = 'md-body';

    var answer = parts.answer;
    // 流式时末尾可能是半个标签（比如 "<thi"），先藏起来，避免闪一下
    if (streaming) answer = answer.replace(/<[^>]{0,12}$/, '');

    body.innerHTML = renderMarkdown(answer);
    el.appendChild(body);
  }

  /* ---------------- 消息渲染 ---------------- */

  function messageNode(msg, isLast) {
    var wrap = document.createElement('div');
    wrap.className = 'msg ' + (msg.role === 'user' ? 'user' : 'assistant');

    var avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = msg.role === 'user' ? '你' : 'AI';

    var bubble = document.createElement('div');
    bubble.className = 'bubble';

    var md = document.createElement('div');
    md.className = 'md';
    // 用户消息原样渲染（万一他自己打了 think 标签，不该被折叠）
    if (msg.role === 'user') md.innerHTML = renderMarkdown(msg.content);
    else renderContent(md, msg.content, false);
    bubble.appendChild(md);

    var actions = document.createElement('div');
    actions.className = 'msg-actions';

    var copyBtn = iconButton('copy', '复制这条消息', 'copy');
    copyBtn.addEventListener('click', async function () {
      // 只复制正文，思考过程留在页面上
      var payload = msg.role === 'user' ? msg.content : answerOnly(msg.content);
      if (await copyText(payload)) flashIcon(copyBtn, 'check', 'copy');
    });
    actions.appendChild(copyBtn);

    // 助手消息随时可重新生成；最后一条用户消息也可（用于中断后重试）
    if (msg.role !== 'user' || isLast) {
      var regenBtn = iconButton('refresh', '重新生成', 'regenerate');
      regenBtn.addEventListener('click', function () { regenerate(); });
      actions.appendChild(regenBtn);
    }

    bubble.appendChild(actions);
    wrap.appendChild(avatar);
    wrap.appendChild(bubble);

    return { node: wrap, md: md };
  }

  function renderMessages() {
    var box = $('#messages');
    box.innerHTML = '';

    var msgs = state.current ? state.current.messages : [];
    if (!msgs.length) {
      box.appendChild(welcomeNode());
      return;
    }

    var wrap = document.createElement('div');
    wrap.className = 'msg-wrap';
    for (var i = 0; i < msgs.length; i += 1) {
      wrap.appendChild(messageNode(msgs[i], i === msgs.length - 1).node);
    }
    box.appendChild(wrap);
  }

  function welcomeNode() {
    var el = document.createElement('div');
    el.className = 'welcome';

    var h1 = document.createElement('h1');
    h1.textContent = '今天想聊点什么？';
    var p = document.createElement('p');
    p.textContent = '对话会自动保存在 R2 里，随时可以回来继续。';

    var chips = document.createElement('div');
    chips.className = 'chips';
    var samples = [
      '用一句话解释量子纠缠',
      '帮我写一个 Python 快速排序，并加注释',
      '把这段话改得更专业：我们这个东西特别好用',
      '给我一份三天杭州旅游行程'
    ];
    samples.forEach(function (text) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip';
      b.textContent = text;
      b.addEventListener('click', function () {
        $('#input').value = text;
        autoResize();
        $('#input').focus();
      });
      chips.appendChild(b);
    });

    el.appendChild(h1);
    el.appendChild(p);
    el.appendChild(chips);
    return el;
  }

  function appendMessageNode(msg) {
    var box = $('#messages');
    if ($('.welcome', box)) box.innerHTML = '';
    var wrap = $('.msg-wrap', box);
    if (!wrap) {
      wrap = document.createElement('div');
      wrap.className = 'msg-wrap';
      box.appendChild(wrap);
    }
    var built = messageNode(msg);
    wrap.appendChild(built.node);
    scrollToBottom();
    return built;
  }

  function scrollToBottom(force) {
    var box = $('#messages');
    var near = box.scrollHeight - box.scrollTop - box.clientHeight < 140;
    if (force || near) box.scrollTop = box.scrollHeight;
  }

  /* ---------------- 会话列表 ---------------- */

  function renderConvList() {
    var el = $('#convList');
    el.innerHTML = '';

    if (!state.conversations.length) {
      var empty = document.createElement('div');
      empty.className = 'empty-side';
      empty.textContent = '暂无对话';
      el.appendChild(empty);
      return;
    }

    state.conversations.forEach(function (c) {
      var item = document.createElement('div');
      item.className = 'conv-item' + (state.current && state.current.id === c.id ? ' active' : '');

      var title = document.createElement('div');
      title.className = 'conv-title';
      title.textContent = c.title || '新对话';

      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'conv-del';
      del.title = '删除对话';
      del.textContent = '×';
      del.addEventListener('click', function (ev) {
        ev.stopPropagation();
        removeConversation(c.id);
      });

      item.appendChild(title);
      item.appendChild(del);
      item.addEventListener('click', function () { openConversation(c.id); });
      el.appendChild(item);
    });
  }

  function upsertLocalMeta(conv) {
    var meta = {
      id: conv.id,
      title: conv.title,
      createdAt: conv.createdAt,
      updatedAt: conv.updatedAt,
      messageCount: conv.messages ? conv.messages.length : 0
    };
    var idx = -1;
    for (var i = 0; i < state.conversations.length; i += 1) {
      if (state.conversations[i].id === conv.id) { idx = i; break; }
    }
    if (idx >= 0) state.conversations[idx] = meta;
    else state.conversations.unshift(meta);
    state.conversations.sort(function (a, b) {
      return String(b.updatedAt || '').localeCompare(String(a.updatedAt || ''));
    });
    renderConvList();
  }

  /* ---------------- 会话操作 ---------------- */

  async function loadConversations() {
    try {
      var data = await api('/api/conversations');
      state.conversations = Array.isArray(data.conversations) ? data.conversations : [];
      renderConvList();
    } catch (e) {
      if (e.status !== 401) showToast(e.message);
    }
  }

  async function openConversation(id) {
    if (state.streaming) return showToast('请先停止当前生成');
    try {
      var data = await api('/api/conversations/' + encodeURIComponent(id));
      state.current = data.conversation;
      if (!Array.isArray(state.current.messages)) state.current.messages = [];
      $('#convTitle').textContent = state.current.title || '新对话';
      renderMessages();
      renderConvList();
      scrollToBottom(true);
      closeSidebar();
    } catch (e) {
      if (e.status === 404) {
        state.conversations = state.conversations.filter(function (c) { return c.id !== id; });
        renderConvList();
      }
      if (e.status !== 401) showToast(e.message);
    }
  }

  function newChat() {
    if (state.streaming) return showToast('请先停止当前生成');
    state.current = { id: '', title: '新对话', messages: [] };
    $('#convTitle').textContent = '新对话';
    renderMessages();
    renderConvList();
    $('#input').focus();
    closeSidebar();
  }

  async function removeConversation(id) {
    var ok = await askConfirm('删除这个对话？删除后无法恢复。');
    if (!ok) return;
    if (state.current && state.current.id === id) abortStream('reset');
    try {
      await api('/api/conversations/' + encodeURIComponent(id), { method: 'DELETE' });
      state.conversations = state.conversations.filter(function (c) { return c.id !== id; });
      if (state.current && state.current.id === id) {
        state.current = { id: '', title: '新对话', messages: [] };
        $('#convTitle').textContent = '新对话';
        renderMessages();
      }
      renderConvList();
      showToast('已删除');
    } catch (e) {
      if (e.status !== 401) showToast(e.message);
    }
  }

  async function renameCurrent() {
    if (!state.current || !state.current.id) return showToast('还没有可重命名的对话');
    var name = window.prompt('重命名对话', state.current.title || '新对话');
    if (name === null) return;
    name = name.trim();
    if (!name) return;
    try {
      await api('/api/conversations/' + encodeURIComponent(state.current.id), {
        method: 'PATCH',
        body: JSON.stringify({ title: name })
      });
      state.current.title = name;
      $('#convTitle').textContent = name;
      var i;
      for (i = 0; i < state.conversations.length; i += 1) {
        if (state.conversations[i].id === state.current.id) state.conversations[i].title = name;
      }
      renderConvList();
      showToast('已重命名');
    } catch (e) {
      if (e.status !== 401) showToast(e.message);
    }
  }

  /* ---------------- 发送 / 流式 ---------------- */

  function setStreaming(on) {
    state.streaming = on;
    $('#sendBtn').classList.toggle('hidden', on);
    $('#stopBtn').classList.toggle('hidden', !on);
    $('#input').disabled = false;
    updateHint();
  }

  /** 中断正在进行的生成（退出登录 / 删除当前对话时调用，避免回调打到已失效的状态上） */
  function abortStream(reason) {
    if (!state.controller) return;
    state.abortReason = reason || 'stop';
    var c = state.controller;
    state.controller = null;
    try { c.abort(); } catch (e) { /* 忽略 */ }
  }

  function updateHint() {
    var parts = [];
    if (state.model) {
      var label = modelLabel(state.model);
      parts.push('模型：' + label + (label !== state.model ? '（' + state.model + '）' : ''));
    }
    if (state.endpointHost) parts.push(state.endpointHost);
    $('#hint').textContent = state.streaming ? '生成中…点击 ■ 可停止' : parts.join(' · ');
  }

  /**
   * 渲染「配置缺失」横幅。
   *
   * 场景：wrangler deploy 上传的是完整新版本，bindings 是全量替换，所以 Dashboard 上的
   * 明文变量默认不会被带回去 —— 重新部署后 API_URL / API_KEY 就消失了。
   * 此时页面本身还能打开，只有发消息才报错，非常难排查。
   * 后端把缺失项和对应修法放在 /api/config 里返回，这里直接摊开讲清楚。
   */
  function renderWarnBanner() {
    var banner = $('#warnBanner');
    if (!state.missing.length) {
      banner.classList.add('hidden');
      return;
    }

    var names = state.missing.map(function (n) { return '<code>' + escapeHtml(n) + '</code>'; }).join('、');

    // 服务端会按缺失类型给修法（缺变量和缺 R2 绑定是两回事，修法完全不同），优先用它；
    // 拿不到时退回下面这段兜底文案。
    var fallback =
      '如果你之前配过，多半是重新部署时被清掉了 —— <code>wrangler deploy</code> 默认会删除' +
      '所有「明文（Text）」类型的变量，而「Secret（加密）」类型不受影响。<br>' +
      '修法：去 Cloudflare Dashboard → 该 Worker → <b>Settings → Variables and Secrets</b>，' +
      '重新添加并<b>把类型选成 Secret</b>；或用 <code>wrangler deploy --keep-vars</code> 部署。';

    $('#warnTitle').textContent = '服务端缺少配置，暂时无法对话';
    $('#warnText').innerHTML =
      '缺少：' + names + '。<br>' +
      (state.missingHint ? escapeHtml(state.missingHint).replace(/\n/g, '<br>') : fallback);
    banner.classList.remove('hidden');
  }

  /**
   * 兜底：配置接口本身失败（后端 500 / 断网 / 返回非 JSON）。
   *
   * 以前这里弹的是登录层，于是「R2 绑定丢了」会表现成「登录失败」，
   * 用户在密码框前反复试密码。现在复用横幅，把原始错误直接摊在页面上。
   */
  function showFatal(message) {
    state.missing = [];
    hideLogin(); // 否则横幅会被登录浮层盖住
    $('#warnTitle').textContent = '页面加载失败';
    $('#warnText').innerHTML =
      escapeHtml(message || '加载配置失败') +
      '<br>这不一定是变量问题：<code>binding_missing</code> 说明 R2 绑定没生效，' +
      '<code>internal_error</code> 要去 Worker 的实时日志里看。';
    $('#warnBanner').classList.remove('hidden');
  }

  async function sendMessage(textOverride, keepCount) {
    var input = $('#input');
    var text = (textOverride != null ? textOverride : input.value).trim();
    if (!text || state.streaming) return;

    // 配置缺失时别浪费一次往返，直接把横幅亮出来
    if (state.missing.length) {
      renderWarnBanner();
      showToast('缺少环境变量：' + state.missing.join('、'));
      return;
    }

    if (textOverride == null) {
      input.value = '';
      autoResize();
    }

    if (!state.current) state.current = { id: '', title: '新对话', messages: [] };

    // 用局部引用锁定本次对话：期间即使退出登录 / 删除对话，流式回调也不会读到 null
    var conv = state.current;

    if (typeof keepCount === 'number') {
      conv.messages = conv.messages.slice(0, keepCount);
      renderMessages();
    }

    conv.messages.push({ role: 'user', content: text });
    appendMessageNode({ role: 'user', content: text });

    // 注意：按钮的点击回调闭包引用的是这个对象本身，所以必须持续更新它的 content，
    // 否则流式结束后点「复制」复制到的是空字符串。
    var liveMsg = { role: 'assistant', content: '' };
    var live = appendMessageNode(liveMsg);
    var cursor = document.createElement('span');
    cursor.className = 'cursor-blink';
    live.md.appendChild(cursor);

    state.controller = new AbortController();
    state.abortReason = null;
    setStreaming(true);

    var acc = '';
    var rafId = 0;
    var settled = false;

    // 收尾：先停掉挂起的 rAF，否则它会在最终渲染之后又补一个光标上去（光标永久残留）
    var finalize = function () {
      settled = true;
      if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
      if (cursor.parentNode) cursor.parentNode.removeChild(cursor);
      liveMsg.content = acc;
      renderContent(live.md, acc, false);
    };

    var paint = function () {
      if (settled || rafId) return;
      rafId = requestAnimationFrame(function () {
        rafId = 0;
        if (settled) return;
        liveMsg.content = acc;
        renderContent(live.md, acc, true);
        var c = document.createElement('span');
        c.className = 'cursor-blink';
        live.md.appendChild(c);
        scrollToBottom();
      });
    };

    var removeLive = function () {
      if (live.node.parentNode) live.node.parentNode.removeChild(live.node);
    };

    try {
      var res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          conversationId: state.current.id || undefined,
          message: text,
          model: state.model,
          keepCount: typeof keepCount === 'number' ? keepCount : undefined
        }),
        signal: state.controller.signal
      });

      if (res.status === 401) {
        state.needsAuth = true;
        showLogin();
        throw new ApiError('未登录或登录已过期', 401);
      }

      if (!res.ok) {
        var raw = await res.text();
        var payload = null;
        try { payload = JSON.parse(raw); } catch (e) { /* 忽略 */ }
        if (payload && payload.conversationId) {
          state.current.id = payload.conversationId;
        }
        throw new ApiError((payload && payload.message) || ('服务端错误（HTTP ' + res.status + '）'), res.status);
      }

      var reader = res.body.getReader();
      var decoder = new TextDecoder();
      var buffer = '';
      var done = false;
      var streamError = '';

      while (!done) {
        var chunk = await reader.read();
        if (chunk.done) break;
        buffer += decoder.decode(chunk.value, { stream: true });
        var lines = buffer.split('\n');
        buffer = lines.pop();

        for (var i = 0; i < lines.length; i += 1) {
          var line = lines[i].trim();
          if (!line || line.indexOf('data:') !== 0) continue;
          var raw2 = line.slice(5).trim();
          if (!raw2) continue;

          var evt;
          try { evt = JSON.parse(raw2); } catch (e) { continue; }

          if (evt.type === 'meta') {
            if (evt.conversationId) {
              var wasNew = !conv.id;
              conv.id = evt.conversationId;
              conv.title = evt.title || conv.title;
              if (state.current === conv) $('#convTitle').textContent = conv.title;
              if (wasNew) upsertLocalMeta(conv);
            }
          } else if (evt.type === 'delta') {
            acc += evt.text || '';
            paint();
          } else if (evt.type === 'error') {
            streamError = evt.message || '生成出错';
          } else if (evt.type === 'done') {
            if (evt.title) {
              conv.title = evt.title;
              if (state.current === conv) $('#convTitle').textContent = evt.title;
            }
          }
        }
      }

      finalize();

      if (streamError && !acc) {
        removeLive();
        throw new ApiError(streamError, 502);
      }

      if (acc) {
        conv.messages.push({ role: 'assistant', content: acc });
        if (state.current === conv) upsertLocalMeta(conv);
      } else {
        removeLive();
      }
      if (streamError) showToast(streamError);
    } catch (e) {
      if (e && e.name === 'AbortError') {
        finalize();
        var quiet = state.abortReason === 'reset';
        if (acc) {
          conv.messages.push({ role: 'assistant', content: acc });
          if (state.current === conv) upsertLocalMeta(conv);
          if (!quiet) showToast('已停止生成');
        } else {
          removeLive();
          if (!quiet) showToast('已停止生成');
        }
      } else {
        finalize();
        if (!acc) {
          removeLive();
          // 这一轮没有任何内容，重建列表让末尾的用户消息拿到「重新生成」按钮
          renderMessages();
        } else {
          conv.messages.push({ role: 'assistant', content: acc });
          if (state.current === conv) upsertLocalMeta(conv);
        }
        if (e && e.status !== 401) {
          var notice = document.createElement('div');
          notice.className = 'notice';
          var span = document.createElement('span');
          span.textContent = (e && e.message) || '请求失败';
          var retry = document.createElement('button');
          retry.type = 'button';
          retry.className = 'btn tiny';
          retry.textContent = '重试';
          retry.addEventListener('click', function () {
            if (notice.parentNode) notice.parentNode.removeChild(notice);
            regenerate();
          });
          notice.appendChild(span);
          notice.appendChild(retry);
          $('#messages').appendChild(notice);
        }
      }
    } finally {
      state.controller = null;
      setStreaming(false);
      scrollToBottom();
    }
  }

  function regenerate() {
    if (state.streaming) return;
    if (!state.current || !state.current.id) return;
    var msgs = state.current.messages;
    var lastUser = -1;
    for (var i = msgs.length - 1; i >= 0; i -= 1) {
      if (msgs[i].role === 'user') { lastUser = i; break; }
    }
    if (lastUser < 0) return showToast('没有可重新生成的消息');
    var text = msgs[lastUser].content;
    sendMessage(text, lastUser);
  }

  /* ---------------- 登录 ---------------- */

  function showLogin() {
    $('#loginOverlay').classList.remove('hidden');
    setTimeout(function () { $('#loginPassword').focus(); }, 60);
  }

  function hideLogin() {
    $('#loginOverlay').classList.add('hidden');
  }

  async function doLogin(ev) {
    ev.preventDefault();
    var btn = $('#loginSubmit');
    var errBox = $('#loginError');
    errBox.textContent = '';
    btn.disabled = true;
    btn.textContent = '验证中…';
    try {
      await api('/api/login', {
        method: 'POST',
        body: JSON.stringify({ password: $('#loginPassword').value })
      });
      $('#loginPassword').value = '';
      hideLogin();
      await boot();
    } catch (e) {
      errBox.textContent = e.message || '登录失败';
    } finally {
      btn.disabled = false;
      btn.textContent = '进入';
    }
  }

  async function doLogout() {
    abortStream('reset');
    try { await api('/api/logout', { method: 'POST' }); } catch (e) { /* 忽略 */ }
    state.conversations = [];
    state.current = null;
    renderConvList();
    showLogin();
  }

  /* ---------------- 确认弹窗 ---------------- */

  function askConfirm(message) {
    return new Promise(function (resolve) {
      var mask = document.createElement('div');
      mask.className = 'modal-mask';
      var box = document.createElement('div');
      box.className = 'modal';
      var h = document.createElement('h3');
      h.textContent = '确认操作';
      var p = document.createElement('p');
      p.textContent = message;
      p.style.margin = '0';
      p.style.color = 'var(--text-2)';
      var actions = document.createElement('div');
      actions.className = 'actions';

      var cancel = document.createElement('button');
      cancel.type = 'button';
      cancel.className = 'btn';
      cancel.textContent = '取消';

      var ok = document.createElement('button');
      ok.type = 'button';
      ok.className = 'btn danger';
      ok.textContent = '删除';

      function finish(value) {
        if (mask.parentNode) mask.parentNode.removeChild(mask);
        document.removeEventListener('keydown', onKey);
        resolve(value);
      }
      function onKey(ev) { if (ev.key === 'Escape') finish(false); }

      cancel.addEventListener('click', function () { finish(false); });
      ok.addEventListener('click', function () { finish(true); });
      mask.addEventListener('click', function (ev) { if (ev.target === mask) finish(false); });
      document.addEventListener('keydown', onKey);

      actions.appendChild(cancel);
      actions.appendChild(ok);
      box.appendChild(h);
      box.appendChild(p);
      box.appendChild(actions);
      mask.appendChild(box);
      document.body.appendChild(mask);
      ok.focus();
    });
  }

  /* ---------------- 侧边栏 / 主题 / 输入框 ---------------- */

  function openSidebar() { $('#sidebar').classList.add('open'); $('#scrim').classList.add('show'); }
  function closeSidebar() { $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('show'); }

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    $('#themeBtn').textContent = theme === 'dark' ? '浅色' : '深色';
  }

  function toggleTheme() {
    var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem(LS_THEME, next); } catch (e) { /* 忽略 */ }
    applyTheme(next);
  }

  function autoResize() {
    var ta = $('#input');
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 190) + 'px';
  }

  /** 取某个模型 id 对应的显示名；没配自定义名字时就是 id 本身 */
  function modelLabel(id) {
    for (var i = 0; i < state.models.length; i += 1) {
      if (state.models[i].id === id) return state.models[i].label;
    }
    return id || '';
  }

  /** 顶部那个模型小标签只显示显示名，鼠标悬停能看到真实 id */
  function syncModelTag() {
    var tag = $('#modelTag');
    var label = modelLabel(state.model);
    tag.textContent = label;
    if (label && label !== state.model) tag.title = state.model;
    else tag.removeAttribute('title');
  }

  function fillModels() {
    var sel = $('#modelSelect');
    sel.innerHTML = '';
    state.models.forEach(function (m) {
      var opt = document.createElement('option');
      opt.value = m.id;            // 提交给接口的始终是真实模型 id
      opt.textContent = m.label;   // 界面上显示自定义名字
      if (m.label !== m.id) opt.title = m.id;
      sel.appendChild(opt);
    });

    var saved = '';
    try { saved = localStorage.getItem(LS_MODEL) || ''; } catch (e) { saved = ''; }
    var hit = null;
    for (var i = 0; i < state.models.length; i += 1) {
      if (state.models[i].id === saved) { hit = state.models[i]; break; }
    }
    state.model = hit ? hit.id : (state.models[0] ? state.models[0].id : '');

    sel.value = state.model;
    syncModelTag();
    updateHint();
  }

  /* ---------------- 启动 ---------------- */

  async function boot() {
    var cfg;
    try {
      cfg = await api('/api/config');
    } catch (e) {
      if (e.status === 401) return; // showLogin 已由 api() 触发
      // 非鉴权类失败（500 / 断网 / 非 JSON）不能当登录问题处理，否则会误导用户去试密码
      showFatal(e.message);
      return;
    }

    hideLogin();
    state.needsAuth = !!cfg.needsAuth;
    state.title = cfg.title || 'AI Chat';
    state.endpointHost = cfg.endpointHost || '';
    state.missing = (Array.isArray(cfg.missing) ? cfg.missing : [])
      .map(function (n) { return String(n == null ? '' : n).trim(); })
      .filter(Boolean);
    state.missingHint = cfg.missingHint || '';
    // 兼容两种返回形态：{id,label} 对象数组，或旧的纯字符串数组
    state.models = (Array.isArray(cfg.models) ? cfg.models : [])
      .map(function (m) {
        if (typeof m === 'string') return { id: m, label: m };
        if (!m) return null;
        var id = String(m.id == null ? '' : m.id).trim();
        if (!id) return null;
        var label = String(m.label == null ? '' : m.label).trim();
        return { id: id, label: label || id };
      })
      .filter(Boolean);
    if (!state.models.length) state.models = [{ id: 'gpt-4o-mini', label: 'gpt-4o-mini' }];

    document.title = state.title;
    $('#brandName').textContent = state.title;
    $('#loginTitle').textContent = state.title;
    $('#logoutBtn').classList.toggle('hidden', !cfg.needsAuth);

    renderWarnBanner();
    fillModels();
    if (!state.current) newChat();
    await loadConversations();
  }

  function bind() {
    $('#newChatBtn').addEventListener('click', newChat);
    $('#renameBtn').addEventListener('click', renameCurrent);
    $('#themeBtn').addEventListener('click', toggleTheme);
    $('#logoutBtn').addEventListener('click', doLogout);
    $('#menuBtn').addEventListener('click', openSidebar);
    $('#scrim').addEventListener('click', closeSidebar);
    $('#loginForm').addEventListener('submit', doLogin);
    $('#warnClose').addEventListener('click', function () {
      $('#warnBanner').classList.add('hidden');
    });

    $('#modelSelect').addEventListener('change', function (ev) {
      state.model = ev.target.value;
      syncModelTag();
      try { localStorage.setItem(LS_MODEL, state.model); } catch (e) { /* 忽略 */ }
      updateHint();
    });

    $('#input').addEventListener('input', autoResize);
    $('#input').addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) {
        ev.preventDefault();
        sendMessage();
      }
    });

    $('#sendBtn').addEventListener('click', function () { sendMessage(); });
    $('#stopBtn').addEventListener('click', function () {
      if (state.controller) state.controller.abort();
    });

    // 代码块复制（事件委托）。必须用 closest —— 图标按钮里的 SVG/path 才是真正的点击目标，
    // 直接判断 ev.target 的 classList 会点不动。
    $('#messages').addEventListener('click', async function (ev) {
      var btn = ev.target && ev.target.closest ? ev.target.closest('.copy-code') : null;
      if (!btn) return;
      var block = btn.closest('.code-block');
      var code = block ? $('code', block) : null;
      if (code && (await copyText(code.textContent))) flashIcon(btn, 'check', 'copy');
    });
  }

  // 初始化
  var savedTheme = 'light';
  try {
    savedTheme = localStorage.getItem(LS_THEME) || 'light';
    if (!localStorage.getItem(LS_THEME) && window.matchMedia &&
        window.matchMedia('(prefers-color-scheme: dark)').matches) {
      savedTheme = 'dark';
    }
  } catch (e) { /* 忽略 */ }
  applyTheme(savedTheme);

  bind();
  boot();
})();
</script>
</body>
</html>
